<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eheliyagoda Central College</title>
<meta name="description" content="Eheliyagoda Central College — මානිවත්ත අභික්කම. Heritage, learning and student life.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..500&family=Archivo:wght@300..700&family=Noto+Serif+Sinhala:wght@300..700&display=swap">
<style>
/* ─────────────────────────────  TOKENS  ───────────────────────────── */
:root{
  --ink:#1E070A; --deep:#4A0C14; --maroon:#7C1521; --gold:#D9A520;
  --cream:#F6EFE3; --paper:#FDFAF4; --rule:#E2D8C7; --muted:#6B5A55;
  --fd:'Newsreader'; --fb:'Archivo'; --fs:'Noto Serif Sinhala';
  --radius:3px; --scale:1;
  --dsp:var(--fd),'Noto Serif Sinhala',Georgia,'Times New Roman',serif;
  --bdy:var(--fb),'Noto Sans Sinhala',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sin:var(--fs),'Noto Serif Sinhala','Iskoola Pota',serif;
  --wrap:1240px; --pad:clamp(20px,5vw,56px);
  --sec:clamp(72px,9vw,132px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --e-bg:#17100F; --e-fg:#EFE6E2; --e-line:#33241F; --e-card:#1F1614;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --e-bg:#120C0B; }
}
:root[data-theme="dark"]{ --e-bg:#120C0B; }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--bdy); font-size:calc(16px * var(--scale)); line-height:1.65;
  font-weight:380; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
::selection{background:var(--gold);color:#fff}

/* ─────────────────────────────  PRIMITIVES  ───────────────────────────── */
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--pad)}
.sec{padding-block:var(--sec);position:relative}
.sec--tight{padding-block:clamp(48px,6vw,84px)}
.dark{background:var(--deep);color:#F4E9E5}
.dark .lede,.dark .muted{color:#CDB2AC}
.cream{background:var(--cream)}

.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--bdy);font-size:calc(11.5px * var(--scale));font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--maroon);margin:0 0 22px;
}
.eyebrow::before{content:"";width:30px;height:1px;background:currentColor;opacity:.8}
.dark .eyebrow,.band .eyebrow,#lens .eyebrow,#video .eyebrow,#sport .eyebrow,.ach-main .eyebrow{color:var(--gold)}

h1,h2,h3,h4{font-family:var(--dsp);font-weight:400;letter-spacing:-.018em;margin:0;text-wrap:balance}
.h-xl{font-size:calc(clamp(40px,6.6vw,86px) * var(--scale));line-height:1.02}
.h-lg{font-size:calc(clamp(31px,4.3vw,55px) * var(--scale));line-height:1.08}
.h-md{font-size:calc(clamp(24px,2.7vw,34px) * var(--scale));line-height:1.18}
.h-sm{font-size:calc(clamp(19px,1.7vw,23px) * var(--scale));line-height:1.28}
.sinhala{font-family:var(--sin);letter-spacing:0;line-height:1.35}
.lede{font-size:calc(clamp(16px,1.25vw,18.5px) * var(--scale));color:var(--muted);max-width:60ch;margin:18px 0 0;line-height:1.7}
.muted{color:var(--muted)}
p{margin:0 0 1.05em}
.rule{height:1px;background:var(--rule);border:0;margin:0}
.dark .rule{background:rgba(255,255,255,.14)}

.btn{
  display:inline-flex;align-items:center;gap:.6em;padding:14px 26px;border-radius:var(--radius);
  background:var(--maroon);color:#fff;font-size:calc(14.5px * var(--scale));font-weight:500;
  letter-spacing:.01em;transition:background .25s var(--ease),transform .25s var(--ease);
  border:1px solid var(--maroon);
}
.btn .ar{transition:transform .3s var(--ease)}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.btn:hover .ar{transform:translateX(5px)}
.btn--ghost{background:transparent;color:var(--maroon);border-color:var(--rule)}
.btn--ghost:hover{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn--light{background:#fff;color:var(--ink);border-color:#fff}
.btn--light:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn--outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn--outline:hover{background:#fff;color:var(--ink);border-color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}

.tlink{display:inline-flex;align-items:center;gap:.5em;font-size:calc(14px * var(--scale));font-weight:500;color:var(--maroon);border-bottom:1px solid transparent;transition:border-color .25s,gap .25s}
.tlink:hover{border-color:currentColor;gap:.85em}
.dark .tlink{color:var(--gold)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:clamp(36px,4vw,60px)}
.head .lede{margin-top:14px}

/* photo frames */
.ph{background:var(--deep) center/cover no-repeat;position:relative;overflow:hidden;border-radius:var(--radius)}
.ph::before{content:"";position:absolute;inset:0;background:inherit;background-size:cover;background-position:center;transition:transform .85s var(--ease)}
.ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.zoom:hover .ph::before{transform:scale(1.05)}
#mapImg{display:block}

/* crest: white PNG used as a mask so it can take any brand colour */
.crest{display:block;background-color:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:520/682}
.crest.img{background:var(--logo) center/contain no-repeat;-webkit-mask:none;mask:none}

/* ─────────────────────────────  INTRO  ───────────────────────────── */
#intro{position:fixed;inset:0;z-index:200;background:var(--ink);display:grid;place-items:center;text-align:center;color:#fff}
#intro .bg{position:absolute;inset:0;background:var(--deep) center/cover no-repeat;opacity:.34;filter:saturate(.6)}
#intro .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(30,7,10,.55),rgba(30,7,10,.97))}
#intro .in{position:relative;padding:24px}
#intro .word{font-family:var(--sin);font-size:clamp(38px,8vw,92px);line-height:1.2;opacity:0;filter:blur(8px);transform:translateY(14px);display:inline-block;margin:0 .18em}
#intro .crest{width:clamp(64px,9vw,104px);margin:26px auto 0;opacity:0;transform:scale(.94)}
#intro .nm{margin-top:20px;font-size:clamp(11px,1.4vw,14px);letter-spacing:.42em;text-transform:uppercase;opacity:0;color:#EBDBD6;font-weight:500}
#intro .ln{width:0;height:1px;background:var(--gold);margin:22px auto 0}
#intro.go .word{animation:wordIn .9s var(--ease) forwards}
#intro.go .word:nth-child(2){animation-delay:.62s}
#intro.go .crest{animation:crestIn .9s var(--ease) 1.35s forwards}
#intro.go .nm{animation:fadeIn .9s var(--ease) 1.95s forwards}
#intro.go .ln{animation:lineIn 1s var(--ease) 2.05s forwards}
#intro.out{animation:introOut .85s var(--ease) forwards}
@keyframes wordIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes crestIn{to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes lineIn{to{width:min(300px,46vw)}}
@keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.03)}}

/* ─────────────────────────────  NAV  ───────────────────────────── */
#nav{position:fixed;top:0;left:0;right:0;z-index:90;transition:background .4s var(--ease),backdrop-filter .4s,box-shadow .4s,border-color .4s;border-bottom:1px solid transparent}
#nav .bar{display:flex;align-items:center;gap:26px;height:88px;transition:height .35s var(--ease)}
#nav.stuck{background:rgba(40,9,13,.86);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-color:rgba(255,255,255,.1);box-shadow:0 10px 30px -22px rgba(0,0,0,.9)}
#nav.stuck .bar{height:68px}
.brandlink{display:flex;align-items:center;gap:13px;color:#fff;flex:0 0 auto}
.brandlink .crest{width:34px}
.brandlink b{font-family:var(--dsp);font-weight:500;font-size:16.5px;letter-spacing:.005em;line-height:1.1;display:block}
.brandlink .bm{display:block;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px;line-height:1.2}
#menu{display:flex;gap:clamp(12px,1.7vw,26px);margin-left:auto;align-items:center}
#menu a{font-size:13.5px;font-weight:450;color:rgba(255,255,255,.88);padding:8px 0;position:relative;white-space:nowrap}
#menu a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--gold);transition:right .3s var(--ease)}
#menu a:hover::after,#menu a.on::after{right:0}
.navcta{margin-left:clamp(10px,1.6vw,22px);padding:10px 20px;border:1px solid rgba(255,255,255,.4);border-radius:var(--radius);font-size:13px;color:#fff;transition:.25s}
.navcta:hover{background:#fff;color:var(--ink);border-color:#fff}
#burger{display:none;margin-left:auto;width:44px;height:44px;place-items:center;color:#fff}
#burger i{display:block;width:22px;height:1.5px;background:currentColor;position:relative;transition:.3s}
#burger i::before,#burger i::after{content:"";position:absolute;left:0;width:22px;height:1.5px;background:currentColor;transition:.3s}
#burger i::before{top:-7px}#burger i::after{top:7px}
#nav.open #burger i{background:transparent}
#nav.open #burger i::before{transform:rotate(45deg);top:0}
#nav.open #burger i::after{transform:rotate(-45deg);top:0}

/* ─────────────────────────────  HERO  ───────────────────────────── */
#hero{min-height:clamp(620px,96vh,1000px);display:flex;align-items:center;position:relative;color:#fff;overflow:hidden;background:var(--ink)}
#hero .pic{position:absolute;inset:0;background:var(--deep) center/cover no-repeat;transform:scale(1.06);animation:heroPan 18s var(--ease) forwards}
@keyframes heroPan{to{transform:scale(1)}}
#hero .veil{position:absolute;inset:0;background:
  linear-gradient(100deg,rgba(28,6,9,.93) 0%,rgba(7,22,16,.78) 38%,rgba(8,26,19,.42) 70%,rgba(10,30,22,.55) 100%),
  linear-gradient(0deg,rgba(28,6,9,.85) 0%,rgba(28,6,9,0) 42%)}
#hero .in{position:relative;width:100%;padding-block:150px 120px}
#hero .col{max-width:min(760px,92%)}
#hero .kicker{font-size:calc(11.5px * var(--scale));letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:500;margin:0 0 26px;display:flex;align-items:center;gap:14px}
#hero .kicker::before{content:"";width:34px;height:1px;background:var(--gold)}
#hero h1{font-family:var(--sin);font-size:calc(clamp(44px,8.4vw,110px) * var(--scale));line-height:1.18;letter-spacing:-.01em;text-shadow:0 2px 40px rgba(0,0,0,.35)}
#hero .en{font-family:var(--dsp);font-size:calc(clamp(20px,2.7vw,36px) * var(--scale));line-height:1.2;margin-top:18px;color:#F2EFE6;font-weight:300}
#hero .sub{margin-top:24px;font-size:calc(clamp(15px,1.3vw,18px) * var(--scale));color:rgba(255,255,255,.8);max-width:46ch}
.scroller{position:absolute;left:var(--pad);bottom:40px;display:flex;align-items:center;gap:14px;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.scroller .dot{width:1px;height:46px;background:linear-gradient(rgba(255,255,255,.1),var(--gold));position:relative}
.scroller .dot::after{content:"";position:absolute;left:-2px;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--gold);animation:bob 2.4s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-14px);opacity:.35}}

/* ─────────────────────────────  QUICK ACCESS  ───────────────────────────── */
#quick{background:var(--cream);border-bottom:1px solid var(--rule)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.qcard{background:var(--cream);padding:30px 28px 26px;display:flex;flex-direction:column;gap:6px;transition:background .3s var(--ease),color .3s}
.qcard:hover{background:var(--maroon);color:#fff}
.qcard .ic{font-size:19px;line-height:1;margin-bottom:12px;filter:grayscale(.15)}
.qcard b{font-family:var(--dsp);font-size:calc(21px * var(--scale));font-weight:500}
.qcard small{font-size:13px;color:var(--muted);transition:color .3s}
.qcard:hover small{color:rgba(255,255,255,.75)}
.qcard .go{margin-top:16px;font-size:12.5px;letter-spacing:.06em;display:flex;align-items:center;gap:6px;transition:gap .3s}
.qcard:hover .go{gap:12px}

/* ─────────────────────────────  ABOUT  ───────────────────────────── */
.about{display:grid;grid-template-columns:45fr 55fr;gap:clamp(36px,5vw,84px);align-items:center}
.about .stack{position:relative}
.about .main{aspect-ratio:4/5}
.about .sub{position:absolute;right:-28px;bottom:-34px;width:46%;aspect-ratio:4/3;border:7px solid var(--paper);box-shadow:0 26px 50px -30px rgba(30,7,10,.6)}
.about .cap{position:absolute;left:0;bottom:-30px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ─────────────────────────────  HERITAGE  ───────────────────────────── */
#heritage{background:var(--maroon);color:#fff;padding-block:clamp(56px,7vw,92px);text-align:center}
#heritage p{font-family:var(--dsp);font-size:calc(clamp(22px,3.1vw,40px) * var(--scale));line-height:1.3;font-weight:300;margin:0 auto;max-width:22ch}
#heritage .ln{width:min(420px,60%);height:1px;background:rgba(255,255,255,.3);margin:34px auto 0}
#heritage .sinhala{margin-top:22px;font-size:calc(clamp(15px,1.7vw,20px) * var(--scale));color:var(--gold)}

/* ─────────────────────────────  TIMELINE  ───────────────────────────── */
.tl{position:relative;margin-top:20px}
.tl .track{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--rule)}
.tl .fill{position:absolute;left:0;top:9px;height:1px;background:var(--maroon);width:0;transition:width 1.6s var(--ease)}
.tl .items{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:24px}
.tl .it{padding-top:34px;position:relative;opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.tl.seen .it{opacity:1;transform:none}
.tl.seen .fill{width:100%}
.tl .it::before{content:"";position:absolute;top:5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--maroon);transition:background .4s}
.tl .it:hover::before{background:var(--gold);border-color:var(--gold)}
.tl .yr{font-family:var(--dsp);font-size:calc(30px * var(--scale));color:var(--maroon);line-height:1}
.tl b{display:block;margin:10px 0 7px;font-size:calc(15px * var(--scale));font-weight:600}
.tl p{font-size:calc(14px * var(--scale));color:var(--muted);margin:0;line-height:1.6}

/* ─────────────────────────────  ACADEMICS  ───────────────────────────── */
.progs{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.6vw,22px)}
.prog{position:relative;overflow:hidden;border-radius:var(--radius);display:block;color:#fff;isolation:isolate}
.prog .ph{aspect-ratio:3/4.1}
.prog .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,7,10,.92) 6%,rgba(30,7,10,.34) 52%,rgba(30,7,10,.18) 100%);transition:opacity .45s}
.prog:hover .ov{opacity:.82}
.prog .tx{position:absolute;left:0;right:0;bottom:0;padding:26px 24px;transition:transform .45s var(--ease)}
.prog:hover .tx{transform:translateY(-6px)}
.prog .lb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.prog h3{font-size:calc(clamp(20px,1.7vw,25px) * var(--scale));margin:9px 0 8px}
.prog p{font-size:13.4px;color:rgba(255,255,255,.76);margin:0;line-height:1.55;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .4s}
.prog:hover p{max-height:90px;opacity:1}
.prog .ar{margin-top:14px;display:inline-block;color:var(--gold);transition:transform .4s var(--ease)}
.prog:hover .ar{transform:translateX(7px)}

.util{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(30px,3.5vw,48px);border-top:1px solid var(--rule)}
.util a{padding:22px 4px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-inline:22px;font-size:calc(14.5px * var(--scale));font-weight:500;transition:background .3s,padding-left .3s}
.util a:last-child{border-right:0}
.util a:hover{background:var(--cream);padding-left:30px}
.util a span{color:var(--maroon)}

/* ─────────────────────────────  STATS  ───────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,3vw,40px);margin-top:44px}
.stat .n{font-family:var(--dsp);font-size:calc(clamp(42px,5.4vw,72px) * var(--scale));line-height:1;color:#fff;font-weight:300}
.stat .n .suf{color:var(--gold)}
.stat .n .empty{color:var(--gold);opacity:.55;letter-spacing:.06em}
.stat .lb{margin-top:12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#C7ACA6}
.stat{border-top:1px solid rgba(255,255,255,.16);padding-top:22px}

/* ─────────────────────────────  STUDENT LIFE  ───────────────────────────── */
.editorial{display:grid;grid-template-columns:1.62fr 1fr;grid-template-rows:repeat(2,1fr);gap:clamp(12px,1.4vw,20px);min-height:min(74vh,660px)}
.editorial .a{grid-row:1/3}
.editorial .ph{height:100%;width:100%}
.editorial figure{margin:0;position:relative;overflow:hidden;border-radius:var(--radius)}
.editorial figcaption{position:absolute;left:0;bottom:0;padding:20px 22px;color:#fff;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(0deg,rgba(30,7,10,.8),transparent);width:100%}

/* ─────────────────────────────  SOCIETIES  ───────────────────────────── */
.rail{display:flex;gap:clamp(14px,1.6vw,22px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin;margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad)}
.rail::-webkit-scrollbar{height:3px}
.rail::-webkit-scrollbar-thumb{background:var(--rule)}
.soc{flex:0 0 clamp(230px,26vw,300px);scroll-snap-align:start;position:relative;overflow:hidden;border-radius:var(--radius);color:#fff}
.soc .ph{aspect-ratio:3/3.6}
.soc.feat{flex-basis:clamp(280px,34vw,400px)}
.soc.feat .ph{aspect-ratio:3/3.6}
.soc .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,7,10,.9) 8%,rgba(30,7,10,.15) 60%)}
.soc .tx{position:absolute;inset:auto 0 0 0;padding:22px}
.soc h3{font-size:calc(19px * var(--scale))}
.soc small{display:block;margin-top:6px;font-size:12.5px;color:rgba(255,255,255,.7)}
.soc .flag{position:absolute;top:16px;left:16px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--gold);color:#2A1A02;padding:5px 10px;border-radius:2px;font-weight:600}
.railnav{display:flex;gap:8px;margin-left:auto}
.railnav button{width:42px;height:42px;border:1px solid var(--rule);border-radius:50%;display:grid;place-items:center;transition:.25s}
.railnav button:hover{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* ─────────────────────────────  SPORT  ───────────────────────────── */
#sport{position:relative;color:#fff;overflow:hidden;background:var(--ink)}
#sport .pic{position:absolute;inset:0;background:var(--deep) center/cover no-repeat}
#sport .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(28,6,9,.92),rgba(28,6,9,.55) 55%,rgba(28,6,9,.3))}
#sport .in{position:relative;padding-block:clamp(90px,13vw,190px)}
#sport h2{max-width:14ch}

/* ─────────────────────────────  HOUSES  ───────────────────────────── */
.houses{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.6vw,20px)}
.house{position:relative;overflow:hidden;border-radius:var(--radius);color:#fff;display:block}
.house .ph{aspect-ratio:1/1.16}
.house .ov{position:absolute;inset:0;transition:opacity .4s;mix-blend-mode:multiply;opacity:.82}
.house:hover .ov{opacity:.92}
.house .tx{position:absolute;inset:auto 0 0 0;padding:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.house h3{font-size:calc(22px * var(--scale))}
.house small{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.82}
.house .cr{width:34px;opacity:.9;color:#fff}

/* ─────────────────────────────  EVENTS  ───────────────────────────── */
.events{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(24px,3vw,48px);align-items:start}
.ev-main .ph{aspect-ratio:16/10}
.datebox{display:flex;gap:16px;align-items:baseline;margin-top:22px}
.datebox .d{font-family:var(--dsp);font-size:calc(42px * var(--scale));line-height:1;color:var(--maroon)}
.datebox .m{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ev-list{display:flex;flex-direction:column}
.ev-row{display:grid;grid-template-columns:78px 1fr auto;gap:20px;align-items:center;padding:22px 0;border-top:1px solid var(--rule);transition:padding-left .3s var(--ease)}
.ev-row:last-child{border-bottom:1px solid var(--rule)}
.ev-row:hover{padding-left:10px}
.ev-row .dt{font-family:var(--dsp);font-size:calc(19px * var(--scale));color:var(--maroon);line-height:1.15}
.ev-row .dt small{display:block;font-family:var(--bdy);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ev-row b{font-weight:550;font-size:calc(15.5px * var(--scale));display:block}
.ev-row span.loc{font-size:13px;color:var(--muted)}
.ev-row .ar{color:var(--maroon);transition:transform .3s}
.ev-row:hover .ar{transform:translateX(5px)}

/* ─────────────────────────────  NEWS  ───────────────────────────── */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,2.6vw,38px)}
.art .ph{aspect-ratio:16/11;margin-bottom:20px}
.art .meta{display:flex;gap:14px;align-items:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.art .meta em{font-style:normal;color:var(--maroon);font-weight:600}
.art h3{margin:12px 0 10px;font-size:calc(clamp(19px,1.6vw,23px) * var(--scale));line-height:1.25}
.art:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.art p{font-size:14.2px;color:var(--muted);margin:0 0 14px;line-height:1.6}

/* ─────────────────────────────  ACHIEVEMENTS  ───────────────────────────── */
.ach{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,3vw,46px)}
.ach-main{position:relative;overflow:hidden;border-radius:var(--radius);color:#fff;display:block;min-height:420px}
.ach-main .ph{position:absolute;inset:0}
.ach-main .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,7,10,.94) 10%,rgba(30,7,10,.2) 70%)}
.ach-main .tx{position:relative;padding:clamp(28px,3vw,44px);display:flex;flex-direction:column;justify-content:flex-end;min-height:420px}
.ach-list{display:flex;flex-direction:column;gap:2px}
.ach-row{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:20px 22px;background:var(--cream);border-radius:var(--radius);transition:background .3s,transform .3s var(--ease)}
.ach-row:hover{background:var(--maroon);color:#fff;transform:translateX(4px)}
.ach-row .cat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);font-weight:600;width:76px}
.ach-row:hover .cat{color:var(--gold)}
.ach-row b{font-weight:500;font-size:calc(15.5px * var(--scale))}
.ach-row .yr{font-family:var(--dsp);font-size:15px;opacity:.7}

/* ─────────────────────────────  LENS  ───────────────────────────── */
#lens{background:#150607;color:#fff}
.lens-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px;height:min(82vh,720px)}
.lens-grid .g{position:relative;overflow:hidden;border-radius:var(--radius);cursor:zoom-in}
.lens-grid .g:nth-child(1){grid-row:1/3}
.lens-grid .ph{position:absolute;inset:0;filter:brightness(.78) saturate(.95);transition:filter .6s,transform .9s var(--ease)}
.lens-grid .g:hover .ph{filter:brightness(1);transform:scale(1.045)}
.lens-grid figcaption{position:absolute;left:18px;bottom:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:.4s var(--ease)}
.lens-grid .g:hover figcaption{opacity:1;transform:none}

/* ─────────────────────────────  VIDEO  ───────────────────────────── */
#video{position:relative;color:#fff;background:var(--ink);overflow:hidden}
#video .pic{position:absolute;inset:0;background:var(--deep) center/cover no-repeat;filter:brightness(.62)}
#video .pic::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(6,18,13,.5),rgba(6,18,13,.9))}
#video .in{position:relative;padding-block:clamp(90px,13vw,170px);text-align:center}
.play{width:88px;height:88px;border-radius:50%;border:1px solid rgba(255,255,255,.55);display:grid;place-items:center;margin:0 auto 30px;transition:.35s var(--ease);backdrop-filter:blur(3px)}
.play:hover{background:#fff;color:var(--ink);transform:scale(1.06)}
.play svg{width:20px;height:20px;margin-left:4px}

/* ─────────────────────────────  LEADERSHIP  ───────────────────────────── */
.leads{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2vw,28px)}
.lead .ph{aspect-ratio:3/3.7;margin-bottom:16px;filter:grayscale(.28);transition:filter .5s}
.lead:hover .ph{filter:none}
.lead b{display:block;font-family:var(--dsp);font-size:calc(19px * var(--scale));font-weight:500}
.lead small{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);display:block;margin-top:6px}

/* ─────────────────────────────  FACILITIES  ───────────────────────────── */
.facs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.4vw,18px)}
.fac{position:relative;overflow:hidden;border-radius:var(--radius);color:#fff;display:block}
.fac .ph{aspect-ratio:4/3}
.fac .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,7,10,.86),rgba(30,7,10,.05) 65%);transition:background .4s}
.fac:hover .ov{background:linear-gradient(0deg,rgba(124,21,33,.92),rgba(124,21,33,.32) 70%)}
.fac .tx{position:absolute;inset:auto 0 0 0;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.fac h3{font-size:calc(18px * var(--scale))}
.fac .ar{opacity:0;transform:translateX(-6px);transition:.35s var(--ease);color:var(--gold)}
.fac:hover .ar{opacity:1;transform:none}

/* ─────────────────────────────  ALUMNI + CTA  ───────────────────────────── */
.band{position:relative;color:#fff;overflow:hidden;background:var(--ink);text-align:center}
.band .pic{position:absolute;inset:0;background:var(--deep) center/cover no-repeat}
.band .veil{position:absolute;inset:0;background:linear-gradient(0deg,rgba(28,6,9,.9),rgba(28,6,9,.62))}
.band .in{position:relative;padding-block:clamp(90px,13vw,175px)}
.band .eyebrow{justify-content:center}
.band .lede{margin-inline:auto;color:rgba(255,255,255,.78)}
.band .btns{justify-content:center}

/* ─────────────────────────────  DIGITAL  ───────────────────────────── */
.digi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.digi a{background:var(--paper);padding:30px 26px;display:flex;align-items:center;gap:16px;transition:background .3s,color .3s}
.digi a:hover{background:var(--ink);color:#fff}
.digi .ic{font-size:20px}
.digi b{font-weight:500;font-size:calc(15.5px * var(--scale));display:block}
.digi small{font-size:12.6px;color:var(--muted);transition:color .3s}
.digi a:hover small{color:rgba(255,255,255,.66)}

/* ─────────────────────────────  CONTACT  ───────────────────────────── */
.contact{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(30px,4vw,70px);align-items:start}
.dl{margin:26px 0 0;display:grid;gap:20px}
.dl div{display:grid;grid-template-columns:118px 1fr;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.dl dt{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.dl dd{margin:0;font-size:calc(15.5px * var(--scale));line-height:1.55}
.mapcard{border-radius:var(--radius);overflow:hidden;border:1px solid var(--rule);background:var(--cream)}
.mapcard .ph{aspect-ratio:4/3.1;position:relative;background-color:#EDE6D8}
.mapcard .pin{position:absolute;inset:0;display:grid;place-items:center}
.mapcard .pin i{width:14px;height:14px;border-radius:50%;background:var(--maroon);box-shadow:0 0 0 7px rgba(124,21,33,.18),0 0 0 16px rgba(124,21,33,.09);display:block}
.mapcard .foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;font-size:14px}

/* ─────────────────────────────  FOOTER  ───────────────────────────── */
footer{background:#150607;color:#DCC8C3}
footer .top{display:grid;grid-template-columns:1.2fr 2.4fr;gap:clamp(30px,4vw,64px);padding-block:clamp(56px,7vw,86px)}
footer .crest{width:62px;color:#fff}
footer .nm{font-family:var(--dsp);font-size:calc(21px * var(--scale));color:#fff;margin-top:20px;line-height:1.25}
footer .mt{font-family:var(--sin);color:var(--gold);margin-top:8px;font-size:15px}
.fnav{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.fnav h4{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#fff;font-family:var(--bdy);font-weight:600;margin-bottom:16px}
.fnav a{display:block;padding:6px 0;font-size:14px;color:#C6AEA8;transition:color .2s,transform .2s}
.fnav a:hover{color:#fff;transform:translateX(3px)}
footer .base{border-top:1px solid rgba(255,255,255,.1);padding-block:26px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:13px;color:#A9908A}
footer .base a:hover{color:#fff}

/* ─────────────────────────────  OVERLAYS  ───────────────────────────── */
.modal{position:fixed;inset:0;z-index:150;background:rgba(22,5,7,.94);display:none;place-items:center;padding:clamp(16px,4vw,56px);backdrop-filter:blur(6px)}
.modal.on{display:grid}
.modal .x{position:absolute;top:22px;right:26px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);color:#fff;display:grid;place-items:center;font-size:20px}
.modal .x:hover{background:#fff;color:#000}
.modal img,.modal video{max-width:min(1180px,100%);max-height:82vh;border-radius:var(--radius)}
.modal .cap{color:#EADAD5;text-align:center;margin-top:16px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.modal .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.28);color:#fff;display:grid;place-items:center}
.modal .nav:hover{background:#fff;color:#000}
.modal .prev{left:20px}.modal .next{right:20px}
.modal .frame{width:min(1080px,100%);aspect-ratio:16/9;border:0;border-radius:var(--radius)}

/* ─────────────────────────────  REVEAL  ───────────────────────────── */
.rv{opacity:0;transform:translateY(18px)}
.rv.in{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}

/* ─────────────────────────────  EDITOR  ───────────────────────────── */
#editBtn{position:fixed;right:20px;bottom:20px;z-index:120;background:var(--ink);color:#fff;border-radius:999px;padding:13px 20px;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;box-shadow:0 16px 34px -16px rgba(0,0,0,.7);transition:.25s var(--ease)}
#editBtn:hover{transform:translateY(-2px);background:var(--maroon)}
#editBtn svg{width:15px;height:15px}
#ed{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:130;background:var(--e-bg);color:var(--e-fg);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .42s var(--ease);box-shadow:-30px 0 60px -40px rgba(0,0,0,.9);font-family:var(--bdy);font-size:14px}
#ed.on{transform:none}
#ed header{padding:18px 20px;border-bottom:1px solid var(--e-line);display:flex;align-items:center;gap:12px}
#ed header b{font-size:14.5px;font-weight:600;letter-spacing:.02em}
#ed header small{display:block;color:#9E8882;font-size:11.5px;margin-top:2px}
#ed .close{margin-left:auto;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--e-card)}
#ed .close:hover{background:#372723}
#tabs{display:flex;gap:4px;padding:12px 14px;border-bottom:1px solid var(--e-line);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{padding:7px 13px;border-radius:999px;font-size:12.5px;color:#B29B95;white-space:nowrap;transition:.2s}
#tabs button:hover{color:#fff;background:var(--e-card)}
#tabs button.on{background:var(--gold);color:#2A1A02;font-weight:600}
#panels{flex:1;overflow-y:auto;padding:18px 20px 28px;scrollbar-width:thin}
#panels::-webkit-scrollbar{width:6px}
#panels::-webkit-scrollbar-thumb{background:#372723;border-radius:3px}
.grp{margin-bottom:26px}
.grp>h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 4px;font-family:var(--bdy);font-weight:600}
.grp>.hint{color:#9E8882;font-size:12px;margin:0 0 14px;line-height:1.5}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;color:#B29B95;margin-bottom:6px;letter-spacing:.04em}
.fld input[type=text],.fld textarea,.fld select{width:100%;background:var(--e-card);border:1px solid var(--e-line);color:var(--e-fg);border-radius:7px;padding:10px 12px;font:inherit;font-size:13.4px;transition:border-color .2s}
.fld textarea{min-height:88px;resize:vertical;line-height:1.55}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--gold)}
.fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw{display:flex;align-items:center;gap:10px;background:var(--e-card);border:1px solid var(--e-line);border-radius:7px;padding:8px 10px}
.sw input[type=color]{width:30px;height:30px;padding:0;border:0;background:none;border-radius:6px;cursor:pointer}
.sw div{min-width:0}
.sw b{display:block;font-size:12px;font-weight:500}
.sw small{font-size:10.5px;color:#9E8882;text-transform:uppercase}
.imgfld{display:flex;gap:11px;align-items:center;background:var(--e-card);border:1px solid var(--e-line);border-radius:8px;padding:9px}
.imgfld .tb{width:56px;height:44px;border-radius:5px;background:#171010 center/cover no-repeat;flex:0 0 auto;border:1px solid var(--e-line)}
.imgfld .ac{display:flex;gap:6px;margin-top:6px}
.imgfld button{font-size:11.5px;padding:5px 10px;border-radius:5px;background:#33231F;color:#E4D3CE}
.imgfld button:hover{background:var(--gold);color:#2A1A02}
.imgfld .nm{font-size:11.5px;color:#B29B95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items{display:grid;gap:8px}
.item{border:1px solid var(--e-line);border-radius:8px;background:var(--e-card);overflow:hidden}
.item>summary{padding:11px 13px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;list-style:none}
.item>summary::-webkit-details-marker{display:none}
.item>summary::before{content:"▸";color:var(--gold);font-size:11px;transition:transform .2s}
.item[open]>summary::before{transform:rotate(90deg)}
.item .body{padding:4px 13px 13px;border-top:1px solid var(--e-line)}
.rowbtns{display:flex;gap:6px;margin-top:10px}
.rowbtns button{font-size:11.5px;padding:6px 11px;border-radius:6px;background:#33231F;color:#E4D3CE}
.rowbtns button:hover{background:#44302B}
.rowbtns .del:hover{background:#7A2B2B;color:#fff}
.addbtn{width:100%;margin-top:9px;padding:10px;border:1px dashed var(--e-line);border-radius:8px;color:#B29B95;font-size:12.5px}
.addbtn:hover{border-color:var(--gold);color:var(--gold)}
#edfoot{border-top:1px solid var(--e-line);padding:14px 20px;display:flex;gap:9px;align-items:center;background:#140E0D}
#edfoot .save{flex:1;background:var(--gold);color:#2A1A02;font-weight:600;padding:11px;border-radius:8px;transition:.2s}
#edfoot .save:hover{filter:brightness(1.08)}
#edfoot .ghost{padding:11px 13px;border-radius:8px;background:var(--e-card);border:1px solid var(--e-line);font-size:13px}
#edfoot .ghost:hover{background:#372723}
#status{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);z-index:160;background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s var(--ease);box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
#status.on{opacity:1;transform:translate(-50%,0)}

/* ─────────────────────────────  RESPONSIVE  ───────────────────────────── */
@media (max-width:1040px){
  .progs,.houses,.leads{grid-template-columns:repeat(2,1fr)}
  .news,.facs{grid-template-columns:repeat(2,1fr)}
  .util{grid-template-columns:repeat(2,1fr)}
  .util a:nth-child(2n){border-right:0}
  .digi{grid-template-columns:repeat(2,1fr)}
  .qgrid{grid-template-columns:repeat(2,1fr)}
  .about,.events,.ach,.contact{grid-template-columns:1fr}
  .about .sub{right:0;width:38%}
  .editorial{grid-template-columns:1fr 1fr;min-height:0}
  .editorial .a{grid-row:1/2;grid-column:1/3;aspect-ratio:16/10}
  .lens-grid{height:auto;grid-template-columns:1fr 1fr}
  .lens-grid .g{aspect-ratio:1/1}
  .lens-grid .g:nth-child(1){grid-row:auto;grid-column:1/3;aspect-ratio:16/10}
  .lens-grid .g:nth-child(4){grid-column:auto}
  .tl .items{grid-template-columns:1fr;gap:0}
  .tl .track,.tl .fill{left:4px;right:auto;top:0;bottom:0;width:1px;height:auto}
  .tl .fill{height:0;width:1px;transition:height 1.6s var(--ease)}
  .tl.seen .fill{height:100%;width:1px}
  .tl .it{padding:0 0 32px 30px}
  .tl .it::before{top:6px}
  footer .top{grid-template-columns:1fr}
  .fnav{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  #menu{position:fixed;inset:68px 0 auto;background:rgba(38,9,13,.97);backdrop-filter:blur(16px);flex-direction:column;align-items:flex-start;gap:0;padding:14px var(--pad) 26px;display:none;border-bottom:1px solid rgba(255,255,255,.12)}
  #nav.open #menu{display:flex}
  #menu a{padding:13px 0;width:100%;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
  .navcta{display:none}
  #burger{display:grid}
  .brandlink b{font-size:14.5px}
  .brandlink .crest{width:30px}
  #hero .in{padding-block:130px 110px}
  .progs,.houses,.leads,.news,.facs,.digi,.stats,.qgrid{grid-template-columns:1fr}
  .stats{gap:0}
  .stat{padding-block:20px}
  .util{grid-template-columns:1fr}
  .util a{border-right:0}
  .editorial{grid-template-columns:1fr}
  .editorial .a{grid-column:auto}
  .editorial figure{aspect-ratio:4/3}
  .lens-grid{grid-template-columns:1fr}
  .lens-grid .g:nth-child(1){grid-column:auto}
  .ev-row{grid-template-columns:64px 1fr auto;gap:14px}
  .about .sub{display:none}
  .dl div{grid-template-columns:1fr;gap:4px}
  #editBtn{right:14px;bottom:14px;padding:11px 16px}
  .scroller{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
}
@media print{#nav,#editBtn,#ed,.scroller{display:none}}
</style>
</head>
<body>

<!-- ══════════ INTRO ══════════ -->
<div id="intro" hidden>
  <div class="bg" data-img="intro.image"></div>
  <div class="in">
    <div><span class="word" id="w1"></span><span class="word" id="w2"></span></div>
    <span class="crest" aria-hidden="true"></span>
    <p class="nm" data-t="brand.name"></p>
    <div class="ln"></div>
  </div>
</div>

<!-- ══════════ NAV ══════════ -->
<header id="nav">
  <div class="wrap bar">
    <a class="brandlink" href="#top">
      <span class="crest" aria-hidden="true"></span>
      <span><b data-t="brand.short"></b><span data-t="brand.motto" class="bm sinhala"></span></span>
    </a>
    <nav id="menu"></nav>
    <a class="navcta" data-t="nav.cta.label" data-href="nav.cta.href"></a>
    <button id="burger" aria-label="Menu" aria-expanded="false"><i></i></button>
  </div>
</header>

<main id="top">

<!-- ══════════ HERO ══════════ -->
<section id="hero">
  <div class="pic" data-img="hero.image"></div>
  <div class="veil"></div>
  <div class="wrap in">
    <div class="col">

/* ── 2. STATE + HELPERS ─────────────────────────────────────────── */
let CFG = clone(DEFAULTS);
let DB = null, ASSETS = null, DOWN = null, dirty = false;
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> [...(r||document).querySelectorAll(s)];
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function get(path,o){ return path.split(".").reduce((a,k)=> (a==null?a:a[k]), o||CFG); }
function set(path,val){
  const k = path.split("."); let o = CFG;
  for(let i=0;i<k.length-1;i++){ if(o[k[i]]==null) o[k[i]] = isNaN(k[i+1])?{}:[]; o = o[k[i]]; }
  o[k[k.length-1]] = val; dirty = true;
}
function merge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)? over : base;
  if(base && typeof base==="object"){
    const out = {...base};
    if(over && typeof over==="object") for(const k in over) out[k] = k in base ? merge(base[k],over[k]) : over[k];
    return out;
  }
  return over===undefined? base : over;
}
function toast(msg){ const s=$("#status"); s.textContent=msg; s.classList.add("on"); clearTimeout(s._t); s._t=setTimeout(()=>s.classList.remove("on"),2600); }

/* placeholder artwork so the page looks complete before real photos arrive */
const PAIRS=[["#3A0A11","#7E1A27"],["#2C0710","#69131F"],["#460F19","#8C2230"],["#26060B","#5C101A"],["#3F0D15","#812232"]];
function ph(seed,label){
  let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0;
  const [a,b]=PAIRS[h%PAIRS.length];
  const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' preserveAspectRatio='xMidYMid slice'>
<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient>
<pattern id='p' width='34' height='34' patternTransform='rotate(${25+(h%40)})' patternUnits='userSpaceOnUse'><rect width='11' height='34' fill='rgba(255,255,255,.035)'/></pattern></defs>
<rect width='800' height='600' fill='url(#g)'/><rect width='800' height='600' fill='url(#p)'/>
<circle cx='${300+(h%220)}' cy='${180+(h%160)}' r='210' fill='rgba(255,255,255,.035)'/>
<g fill='none' stroke='rgba(255,255,255,.2)' stroke-width='1.4'><rect x='356' y='236' width='88' height='60' rx='7'/><circle cx='400' cy='266' r='18'/><path d='M373 236l9-11h36l9 11'/></g>
<text x='400' y='330' text-anchor='middle' fill='rgba(255,255,255,.3)' font-family='Helvetica,Arial,sans-serif' font-size='15' letter-spacing='3'>${esc(String(label||"").toUpperCase())}</text>
<text x='400' y='356' text-anchor='middle' fill='rgba(255,255,255,.22)' font-family='Helvetica,Arial,sans-serif' font-size='12' letter-spacing='2'>ADD A PHOTOGRAPH</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s.replace(/\n/g,"")).replace(/'/g,"%27");
}
function img(path,label){ const v=get(path); return v? v : ph(path,label||""); }

/* ── 5. BEHAVIOUR ───────────────────────────────────────────────── */
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

function intro(){
  const el=$("#intro");
  const words=(CFG.brand.motto||"").trim().split(/\s+/);
  $("#w1").textContent = words[0]||""; $("#w2").textContent = words.slice(1).join(" ");
  if(!CFG.intro.on || reduce || sessionStorage.getItem("ecc.seen")){ el.remove(); return; }
  sessionStorage.setItem("ecc.seen","1");
  el.hidden=false; document.body.classList.add("locked");
  requestAnimationFrame(()=> el.classList.add("go"));
  const end=()=>{ el.classList.add("out"); document.body.classList.remove("locked"); setTimeout(()=>el.remove(),900); };
  const t=setTimeout(end,3600);
  el.addEventListener("click",()=>{ clearTimeout(t); end(); });
}

function observe(){
  if(reduce) return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }}),{threshold:.12});
  $$(".rv:not(.in)").forEach(e=>io.observe(e));
  const tl=$("#timeline");
  if(tl && !tl.classList.contains("seen")){
    new IntersectionObserver((es,o)=>es.forEach(e=>{ if(e.isIntersecting){ tl.classList.add("seen"); o.disconnect(); }}),{threshold:.25}).observe(tl);
  }
  const sg=$("#stats");
  if(sg && !sg.dataset.done){
    new IntersectionObserver((es,o)=>es.forEach(e=>{ if(e.isIntersecting){ sg.dataset.done="1"; count(); o.disconnect(); }}),{threshold:.35}).observe(sg);
  }
}
function count(){
  $$("#statGrid .num").forEach(n=>{
    const raw=(n.dataset.to||"").replace(/[^\d.]/g,""); const to=parseFloat(raw);
    if(!raw || isNaN(to)) return;
    const dur=1400, t0=performance.now();
    const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      n.textContent = Math.round(to*e).toLocaleString(); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ── 6. STORAGE ─────────────────────────────────────────────────── */
const LS="ecc.site.v1";
async function boot(){
  try{ const raw=localStorage.getItem(LS); if(raw) CFG=merge(DEFAULTS,JSON.parse(raw)); }catch(e){}
  render(); intro(); buildEditor();
  if(!window.claude||!claude.use) return;
  try{ DB=await claude.use("db"); }catch(e){}
  try{ ASSETS=await claude.use("assets"); }catch(e){}
  try{ DOWN=await claude.use("downloads"); }catch(e){}
  $("#edmode").textContent = DB? (ASSETS?"Editing the live site":"Read-only view — changes stay on this device")
                               : "Changes are saved on this device";
  if(DB){
    try{
      const snap=await DB.doc("site/home").get();
      if(snap.exists && snap.data() && snap.data().config && !dirty){ CFG=merge(DEFAULTS,snap.data().config); render(); buildEditor(); }
      DB.doc("site/home").onSnapshot(s=>{ if(s.exists && s.data() && s.data().config && !dirty){ CFG=merge(DEFAULTS,s.data().config); render(); buildEditor(); }},()=>{});
    }catch(e){}
  }
}
async function save(){
  try{ localStorage.setItem(LS,JSON.stringify(CFG)); }catch(e){}
  if(DB){
    try{ await DB.doc("site/home").set({config:CFG,updated:Date.now()}); dirty=false; toast("Saved — everyone opening this link sees it"); return; }
    catch(e){ toast("Could not save to the site; kept on this device"); return; }
  }
  dirty=false; toast("Saved on this device");
}

/* image picking */
function pickFile(accept){
  return new Promise(res=>{
    const inp=$("#filePick"); inp.accept=accept; inp.value="";
    inp.onchange=()=>res(inp.files&&inp.files[0]);
    inp.click();
  });
}
async function chooseImage(path,accept){
  const f=await pickFile(accept||"image/*"); if(!f) return;
  if(ASSETS){
    toast("Uploading…");
    try{ const r=await ASSETS.upload(f); set(path,r.url); afterEdit(); toast("Photo added"); return; }
    catch(e){ toast("Upload failed — using this device only"); }
  }
  if(f.size>2.4*1024*1024){ toast("That file is large; try one under 2 MB"); return; }
  const url=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
  set(path,url); afterEdit();
}

/* add-templates keyed by list path */
const ADDS={};
(function collect(groups,prefix){
  TABS.forEach(t=>t.g.forEach(g=>g.f.forEach(f=>walk(f,""))));
  function walk(f,pre){
    if(!f.list) return;
    const p = pre? pre+"."+f.list : f.list;
    ADDS[p]=f.add||{};
    (f.fields||[]).forEach(sub=>{ if(sub.list) ADDS[p+".*."+sub.list]=sub.add||{}; });
  }
})();

/* ── 8. EDITOR UI ───────────────────────────────────────────────── */
let tabIx=0;
function buildEditor(){
  $("#tabs").innerHTML = TABS.map((t,i)=>`<button data-tab="${i}" class="${i===tabIx?"on":""}">${esc(t.n)}</button>`).join("");
  buildPanel();
}
function buildPanel(){
  const t=TABS[tabIx];
  $("#panels").innerHTML = t.g.map(g=>`<div class="grp"><h4>${esc(g.h)}</h4>
    ${g.hint?`<p class="hint">${esc(g.hint)}</p>`:""}
    ${g.cols===1?`<div class="swatches">${g.f.map(f=>fieldHTML(f,"")).join("")}</div>`:g.f.map(f=>fieldHTML(f,"")).join("")}
  </div>`).join("");
}
function fieldHTML(f,pre){
  if(f.list) return listHTML(f,pre);
  const p = pre? pre+"."+f.k : f.k;
  const v = get(p);
  switch(f.t){
    case "area":
      return `<div class="fld"><label>${esc(f.l)}</label><textarea data-path="${p}">${esc(v||"")}</textarea></div>`;
    case "color":
      return `<label class="sw"><input type="color" data-path="${p}" value="${esc(v||"#000000")}">
        <div><b>${esc(f.l)}</b><small>${esc(v||"")}</small></div></label>`;
    case "sel":
      return `<div class="fld"><label>${esc(f.l)}</label><select data-path="${p}">
        ${f.o.map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    case "range":
      return `<div class="fld"><label>${esc(f.l)} — <span class="rv-out">${esc(v)}${esc(f.unit||"")}</span></label>
        <input type="range" data-path="${p}" data-num="1" min="${f.min}" max="${f.max}" step="${f.step}" value="${esc(v)}" style="width:100%"></div>`;
    case "bool":
      return `<label class="sw" style="cursor:pointer"><input type="checkbox" data-path="${p}" data-bool="1" ${v?"checked":""} style="width:17px;height:17px;accent-color:var(--gold)">
        <div><b>${esc(f.l)}</b></div></label>`;
    case "img": case "vid":
      return `<div class="fld"><label>${esc(f.l)}</label><div class="imgfld">
        <span class="tb" style="background-image:url('${f.t==="img"?(v||ph(p,"")):""}')"></span>
        <div style="flex:1;min-width:0"><div class="nm">${v?"File added":"No file yet"}</div>
        <div class="ac"><button data-act="pick" data-kind="${f.t}" data-path="${p}">${v?"Replace":"Upload"}</button>
        ${v?`<button data-act="clear" data-path="${p}">Remove</button>`:""}</div></div></div></div>`;
    default:
      return `<div class="fld"><label>${esc(f.l)}</label><input type="text" data-path="${p}" value="${esc(v==null?"":v)}"></div>`;
  }
}
function listHTML(L,pre){
  const path = pre? pre+"."+L.list : L.list;
  const arr = get(path)||[];
  return `<div class="fld"><label>${esc(L.l)}</label><div class="items">
    ${arr.map((it,i)=>`<details class="item"><summary>${esc(it[L.name]||("Item "+(i+1)))}</summary>
      <div class="body">${(L.fields||[]).map(f=>fieldHTML(f,path+"."+i)).join("")}
        <div class="rowbtns">
          <button data-act="move" data-list="${path}" data-i="${i}" data-d="-1" title="Move up">↑</button>
          <button data-act="move" data-list="${path}" data-i="${i}" data-d="1" title="Move down">↓</button>
          <button class="del" data-act="del" data-list="${path}" data-i="${i}">Delete</button>
        </div></div></details>`).join("")}
    </div><button class="addbtn" data-act="add" data-list="${path}" data-tpl="${esc(tplKey(path))}">+ Add ${esc(L.l.toLowerCase())}</button></div>`;
}
function tplKey(path){ return path.replace(/\.\d+\./g,".*."); }

let raf=null;
function afterEdit(){ if(raf) return; raf=requestAnimationFrame(()=>{ raf=null; render(); if($("#stats").dataset.done) count(); }); }

$("#panels").addEventListener("input",e=>{
  const el=e.target, p=el.dataset.path; if(!p) return;
  let v = el.dataset.bool? el.checked : el.value;
  if(el.dataset.num) v = +v;
  set(p,v);
  if(el.type==="range"){ const o=el.closest(".fld").querySelector(".rv-out"); if(o) o.textContent = v + (el.max<=30?"px":"%"); }
  if(el.type==="color"){ const s=el.closest(".sw").querySelector("small"); if(s) s.textContent=v; }
  const d=el.closest("details.item"); if(d){ const sum=d.querySelector("summary"); if(sum && el.type==="text" && /\.(title|label|name|caption|role)$/.test(p)) sum.textContent=v; }
  afterEdit();
});
$("#panels").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="pick"){ await chooseImage(b.dataset.path, b.dataset.kind==="vid"?"video/*":"image/*"); buildPanel(); return; }
  if(act==="clear"){ set(b.dataset.path,""); afterEdit(); buildPanel(); return; }
  const arr=get(b.dataset.list); if(!Array.isArray(arr)) return;
  const i=+b.dataset.i;
  if(act==="del"){ arr.splice(i,1); }
  if(act==="move"){ const j=i+ +b.dataset.d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; }
  if(act==="add"){ arr.push(clone(ADDS[b.dataset.tpl]||{})); }
  dirty=true; afterEdit(); buildPanel();
});
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return;
  tabIx=+b.dataset.tab; $$("#tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); buildPanel(); $("#panels").scrollTop=0; });

$("#editBtn").onclick=()=>{ $("#ed").classList.add("on"); };
$("#edClose").onclick=()=>{ $("#ed").classList.remove("on"); };
$("#saveBtn").onclick=save;
$("#resetBtn").onclick=()=>{ if(confirm("Restore all original content, photographs and colours?")){ CFG=clone(DEFAULTS); dirty=true; render(); buildEditor(); toast("Reset — press Save to keep it"); } };
$("#exportBtn").onclick=async()=>{
  const data=JSON.stringify(CFG,null,2), name="ecc-site-settings.json";
  if(DOWN){ try{ await DOWN.save({filename:name,data}); toast("Settings exported"); return; }catch(err){ if(err&&err.code==="declined") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; a.click();
  toast("Settings exported");
};
$("#importBtn").onclick=()=>{
  const inp=$("#jsonPick"); inp.value="";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const fr=new FileReader(); fr.onload=()=>{ try{ CFG=merge(DEFAULTS,JSON.parse(fr.result)); dirty=true; render(); buildEditor(); toast("Settings loaded — press Save to keep them"); }
      catch(err){ toast("That file could not be read"); } }; fr.readAsText(f); };
  inp.click();
};
addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

boot();
</script>
</body>
</html>
